add_newline = true
format = """[](fg:#26334A)$directory[](fg:#26334A)$git_branch$git_status$cmd_duration$line_break$character"""

[directory]
style = 'fg:#E5ECF6 bg:#26334A'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
format = ' [](fg:#374F69)[ $symbol$branch ](fg:#E5ECF6 bg:#374F69)[](fg:#374F69)'
symbol = ' '

[git_status]
format = ' [](fg:#45415F)[ $all_status$ahead_behind ](fg:#E5ECF6 bg:#45415F)[](fg:#45415F)'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count} ↓${behind_count}'

[cmd_duration]
min_time = 2000
format = ' [](fg:#45415F)[ $duration ](fg:#E5ECF6 bg:#45415F)[](fg:#45415F)'

[character]
success_symbol = '[❯](bold #9DC7F3)'
error_symbol = '[❯](bold #F197A3)'
